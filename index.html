    .option{border:1px solid var(--line);border-radius:12px;padding:.75rem 1rem;background:white;text-align:left;width:100%;transition:background .2s,border-color .2s}
    .option:hover:not(:disabled){border-color:#67927e;background:#f0f6ed}

    .option.incorrect{border-color:#ce805b;background:#fff0e5}
    .bar{height:8px;background:#dfe7dd;border-radius:999px;overflow:hidden}.fill{height:100%;background:var(--orange);border-radius:999px;transition:width .35s}
    [hidden]{display:none!important}.photo{object-fit:cover;width:100%;height:100%}

         <th scope="col" class="p-3">Latihan</th>

  <script>
(() => {
  const $ = id => document.getElementById(id);
  const steps = ['Welcome','Learning Goals','Apersepsi','Introduction','Concept','Example','Interactive Content','Guided Practice','Application','Assessment','Reflection','Completion'];
  const GUIDED_TOTAL = 8;
  let records = [], student = null, step = 0, ready = false, busy = false, selected = {}, dashboardFromLesson = false;
  const normalize = value => String(value || '').trim().toLowerCase().replace(/\s+/g, ' ');
  const solvedCount = () => Math.max(0, Math.min(GUIDED_TOTAL, Number(student?.guided_practice_score) || 0));
  const initial = (name, cl) => ({
    student_name:name, student_class:cl, login_time:new Date().toISOString(),
    current_section:'0', progress_percentage:0, material_progress:0,
    activity_progress:0, evaluation_progress:0, guided_practice_score:0,
    guided_practice_attempts:0, evaluation_score:0, evaluation_percentage:0,
    evaluation_correct:0, evaluation_wrong:0, evaluation_submitted_at:'',
    reflection_understanding:'', reflection_note:'', completed_at:'',
    status:'Belajar', last_activity:''
  });
  function progress() {
    if (!student) return;
    for (const [key, field] of [['material','material_progress'],['activity','activity_progress'],['evaluation','evaluation_progress']]) {
      const value = Number(student[field]) || 0;
      $(key + '-number').textContent = value + '%';
      $(key + '-fill').style.width = value + '%';
    }
  }
  function dashboard() {
    const body = $('dashboard-rows');
    const seen = new Map([...body.children].map(row => [row.dataset.id, row]));
    $('dashboard-message').textContent = records.length ? `${records.length} profil siswa. Dashboard ini terbuka untuk pengunjung.` : 'Belum ada profil siswa.';
    [...records].sort((a,b) => String(a.student_name).localeCompare(String(b.student_name), 'id')).forEach(record => {
      let row = seen.get(record.__backendId);
      if (!row) {
        row = document.createElement('tr'); row.dataset.id = record.__backendId;
        row.className = 'border-b border-[#e4e8e0]';
        for (let i = 0; i < 6; i++) {
          const cell = document.createElement('td'); cell.className = 'p-3 whitespace-nowrap'; row.append(cell);
        }
        body.append(row);
      }
      [record.student_name,record.student_class,(record.progress_percentage || 0) + '%',
       (record.guided_practice_score || 0) + '/8',
       record.evaluation_submitted_at ? (record.evaluation_percentage || 0) + '%' : '—',
       record.status || 'Belajar'].forEach((value,i) => {
        if (row.children[i].textContent !== String(value)) row.children[i].textContent = value;
      });
      seen.delete(record.__backendId);
    });
    seen.forEach(row => row.remove());
  }
  const handler = {onDataChanged(data) {
    records = data;
    if (student && !busy) {
      const latest = data.find(record => record.__backendId === student.__backendId);
      if (latest) student = latest;
    }
    progress(); dashboard();
    if (student && step === 7 && !$('lesson').hidden) syncGuided();
  }};
  async function write(changes) {
    if (!student || busy) return false;
    busy = true; $('save-status').textContent = 'Menyimpan…';
    try {
      const updated = {...student,...changes};
      const result = await window.dataSdk.update(updated);
      if (!result.isOk) { $('save-status').textContent = 'Gagal menyimpan. Coba lagi.'; return false; }
      student = updated;
      records = records.map(record => record.__backendId === updated.__backendId ? updated : record);
      progress(); dashboard(); $('save-status').textContent = 'Tersimpan di Canva Sheet';
      return true;
    } catch (error) {
      $('save-status').textContent = 'Gagal menyimpan. Periksa koneksi.';
      return false;
    } finally { busy = false; }
  }
  function syncGuided() {
    const done = solvedCount();
    document.querySelectorAll('.guided-card').forEach((card, index) => {
      const solved = index < done, active = index === done;
      card.classList.toggle('is-locked', !solved && !active);
      card.querySelectorAll('button').forEach((button, choice) => {
        button.disabled = !active || busy;
        button.classList.toggle('selected', solved && choice === Number(card.dataset.correct));
        if (solved) button.classList.remove('incorrect');
      });
      card.querySelector('p').hidden = !solved;
    });
    $('guided-summary').textContent = `${done} dari ${GUIDED_TOTAL} latihan dipahami.`;
    if (step === 7) $('next-button').disabled = done < GUIDED_TOTAL || busy;
  }
  function showResults() {
    $('results').hidden = false;
    $('results-detail').textContent = `Skor ${student.evaluation_score}/20 · Benar ${student.evaluation_correct} · Salah ${student.evaluation_wrong} · ${student.evaluation_percentage}%.`;
    $('evaluation-form').querySelectorAll('input,select,button').forEach(el => el.disabled = true);
  }
  function show(n) {
    step = n; $('login').hidden = true; $('dashboard').hidden = true;
    $('lesson').hidden = false; $('learning-shell').hidden = false;
    document.querySelectorAll('[data-step]').forEach(el => el.hidden = Number(el.dataset.step) !== n);
    $('position').textContent = `${String(n + 1).padStart(2,'0')} / 12 · ${steps[n]}`;
    $('back-button').disabled = n === 0;
    $('next-button').hidden = n === 11;
    $('next-button').disabled = (n === 7 && solvedCount() < GUIDED_TOTAL) ||
      (n === 8 && !String(student.last_activity || '').startsWith('Komodo:')) ||
      (n === 9 && !student.evaluation_submitted_at) ||
      (n === 10 && !student.reflection_note);
    $('student-chip').textContent = student.student_name;
    if (n === 0) $('welcome-title').textContent = 'Welcome, ' + student.student_name + '!';
    if (n === 7) syncGuided();
    if (n === 9 && student.evaluation_submitted_at) showResults();
    if (n === 11) $('completion-summary').textContent =
      `${student.student_name} · Nilai ${student.evaluation_percentage}% · Selesai ${new Date(student.completed_at || Date.now()).toLocaleString('id-ID')}`;
    window.scrollTo({top:0,behavior:'smooth'});
  }
  async function move(n) {
    if (!student || busy || n < 0 || n > 11) return;
    if (n > step) {
      if (step === 7 && solvedCount() < GUIDED_TOTAL) {
        $('guided-summary').textContent = `Selesaikan seluruh ${GUIDED_TOTAL} latihan dahulu.`; return;
      }
      if (step === 8 && !String(student.last_activity || '').startsWith('Komodo:')) return;
      if (step === 9 && !student.evaluation_submitted_at) return;
      if (step === 10 && !student.reflection_note) return;
    }
    const changes = {
      current_section:String(n), progress_percentage:Math.round(n / 11 * 100),
      material_progress:Math.min(100,Math.round(Math.min(n,6) / 6 * 100)),
      activity_progress:n >= 9 ? 100 : student.activity_progress,
      status:n === 11 ? 'Selesai' : 'Belajar'
    };
    if (await write(changes)) show(n);
  }

  document.querySelectorAll('.guided-card').forEach(card => {
    [...card.querySelectorAll('button')].forEach((button, choice) => button.addEventListener('click', async () => {
      if (!student || busy || Number(card.dataset.index) !== solvedCount()) return;
      const correct = choice === Number(card.dataset.correct);
      const current = solvedCount();
      card.querySelectorAll('button').forEach(item => item.disabled = true);
      const ok = await write({
        guided_practice_attempts:(Number(student.guided_practice_attempts) || 0) + 1,
        guided_practice_score:current + (correct ? 1 : 0),
        activity_progress:Math.round((current + (correct ? 1 : 0)) / GUIDED_TOTAL * 60)
      });
      if (!ok) {
        syncGuided(); $('guided-summary').textContent = 'Jawaban belum tersimpan. Coba lagi.'; return;
      }
      if (correct) {
        syncGuided();
        const next = document.querySelector(`.guided-card[data-index="${current + 1}"]`);
        if (next) next.scrollIntoView({behavior:'smooth',block:'center'});
      } else {
        button.classList.add('incorrect');
        card.querySelector('p').hidden = false;
        syncGuided();
        card.querySelector('p').hidden = false;
        $('guided-summary').textContent = 'Belum tepat. Baca petunjuk, lalu coba pilihan lain.';
      }
    }));
  });

  const categories = [['','Pilih kategori'],['physical','Physical characteristics'],['habitat','Habitat'],['function','Function'],['habits','Habits'],['species','Species']];
  document.querySelectorAll('.category-select').forEach(select => categories.forEach(([value,label]) => select.add(new Option(label,value))));
  document.querySelectorAll('.truth-select').forEach(select => [['','Pilih jawaban'],['yes','Yes / Ya'],['no','No / Tidak']].forEach(([value,label]) => select.add(new Option(label,value))));
  $('evaluation-form').querySelectorAll('[data-type="choice"]').forEach(card => card.querySelectorAll('button').forEach(button => button.addEventListener('click', () => {
    if (student?.evaluation_submitted_at) return;
    selected[card.dataset.question] = button.dataset.value;
    card.querySelectorAll('button').forEach(item => item.classList.toggle('selected',item === button));
  })));
  $('evaluation-form').addEventListener('submit', async event => {
    event.preventDefault();
    if (!student || busy || student.evaluation_submitted_at) return;
    let correct = 0;
    for (const card of $('evaluation-form').querySelectorAll('[data-question]')) {
      const value = card.dataset.type === 'choice' ? selected[card.dataset.question] : card.querySelector('input,select').value;
      if (!String(value || '').trim()) {
        $('evaluation-feedback').textContent = `Jawab soal nomor ${card.dataset.question} terlebih dahulu.`;
        card.scrollIntoView({behavior:'smooth',block:'center'});
        card.querySelector('button,input,select')?.focus(); return;
      }
      if (normalize(value) === normalize(card.dataset.answer)) correct++;
    }
    $('evaluation-submit').disabled = true;
    $('evaluation-feedback').textContent = 'Menyimpan hasil evaluasi…';
    const ok = await write({
      evaluation_score:correct,evaluation_percentage:correct * 5,
      evaluation_correct:correct,evaluation_wrong:20 - correct,
      evaluation_progress:100,evaluation_submitted_at:new Date().toISOString()
    });
    $('evaluation-feedback').textContent = ok ? 'Evaluasi tersimpan.' : 'Hasil belum tersimpan. Coba kirim lagi.';
    if (ok) { showResults(); $('next-button').disabled = false; }
    else $('evaluation-submit').disabled = false;
  });
  $('login-form').addEventListener('submit', async event => {
    event.preventDefault();
    if (!ready || busy) return;
    const name = $('student-name').value.trim().replace(/\s+/g,' ');
    const cl = $('student-class').value.trim().replace(/\s+/g,' ');
    if (!name || !cl) return;
    busy = true; $('login-submit').disabled = true; $('login-message').textContent = 'Membuka profil…';
    try {
      let found = records.find(record => normalize(record.student_name) === normalize(name) && normalize(record.student_class) === normalize(cl));
      if (!found) {
        if (records.length >= 999) { $('login-message').textContent = 'Batas 999 profil tercapai.'; return; }
        const created = await window.dataSdk.create(initial(name,cl));
        if (!created.isOk) { $('login-message').textContent = 'Profil gagal disimpan. Coba lagi.'; return; }
        found = records.find(record => normalize(record.student_name) === normalize(name) && normalize(record.student_class) === normalize(cl));
        if (!found) { $('login-message').textContent = 'Profil dibuat. Tekan Mulai belajar sekali lagi.'; return; }
      }
      student = found;
      if (String(found.last_activity || '').startsWith('Komodo:')) $('application-answer').value = found.last_activity.slice(8);
      if (found.reflection_note) {
        $('reflection-note').value = found.reflection_note;
        const choice = [...document.querySelectorAll('[name=understanding]')].find(el => el.value === found.reflection_understanding);
        if (choice) choice.checked = true;
      }
      $('login-message').textContent = ''; progress();
      show(Math.max(0,Math.min(11,Number(found.current_section) || 0)));
    } catch (error) {
      $('login-message').textContent = 'Tidak dapat membuka profil. Periksa koneksi.';
    } finally { busy = false; $('login-submit').disabled = false; }
  });
  $('application-form').addEventListener('submit', async event => {
    event.preventDefault(); if (busy || !student) return;
    const text = $('application-answer').value.trim();
    if (text.split(/\n+/).filter(line => line.trim()).length < 3) {
      $('application-feedback').textContent = 'Tulis tiga fakta pada baris terpisah.'; return;
    }
    $('application-submit').disabled = true;
    const ok = await write({last_activity:'Komodo: ' + text,activity_progress:100});
    $('application-feedback').textContent = ok ? 'Catatan tersimpan. Kamu dapat melanjutkan.' : 'Catatan belum tersimpan. Coba lagi.';
    if (ok) $('next-button').disabled = false;
    $('application-submit').disabled = false;
  });
  $('reflection-form').addEventListener('submit', async event => {
    event.preventDefault(); if (busy || !student) return;
    const choice = document.querySelector('[name=understanding]:checked');
    const note = $('reflection-note').value.trim();
    if (!choice || !note) return;
    $('reflection-submit').disabled = true;
    const ok = await write({reflection_understanding:choice.value,reflection_note:note,completed_at:new Date().toISOString(),status:'Selesai'});
    $('reflection-feedback').textContent = ok ? 'Refleksimu tersimpan. Lanjutkan ke halaman akhir.' : 'Refleksi belum tersimpan. Coba lagi.';
    if (ok) $('next-button').disabled = false;
    $('reflection-submit').disabled = false;
  });
  $('prior-reveal').addEventListener('click', () => $('prior-answer').hidden = false);
  $('reference-reveal').addEventListener('click', () => $('reference-answer').hidden = false);
  $('back-button').addEventListener('click', () => move(step - 1));
  $('next-button').addEventListener('click', () => move(step + 1));
  $('dashboard-open').addEventListener('click', () => {
    dashboardFromLesson = !!student && !$('lesson').hidden;
    $('login').hidden = true; $('lesson').hidden = true;
    $('learning-shell').hidden = true; $('dashboard').hidden = false; dashboard();
  });
  $('dashboard-close').addEventListener('click', () => {
    if (dashboardFromLesson && student) show(step);
    else { $('dashboard').hidden = true; $('login').hidden = false; }
  });
  (async () => {
    try { const result = await window.dataSdk.init(handler); ready = result.isOk; }
    catch (error) { ready = false; }
    $('login-submit').disabled = !ready;
    if (!ready) $('login-message').textContent = 'Canva Sheet belum tersedia. Coba buka kembali aplikasi.';
  })();
})();
</script>
 </body>
</html>
